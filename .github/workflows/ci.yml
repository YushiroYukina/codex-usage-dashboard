name: Test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        include:
          - os: windows-latest
            app: windows
          - os: macos-latest
            app: mac
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check-public.py
      - run: node --test apps/${{ matrix.app }}/tests/*.test.mjs
      - if: runner.os == 'macOS'
        run: |
          xcrun swiftc -typecheck apps/mac/macos/AccountSecrets.swift
          xcrun swiftc -typecheck apps/mac/macos/UsageLedger.swift
      - name: Install both macOS editions in the hosted test environment
        if: runner.os == 'macOS'
        shell: bash
        run: |
          node apps/mac/runtime/mac-install.mjs --install-dir "$RUNNER_TEMP/dashboard-sync" --data-dir "$RUNNER_TEMP/dashboard-sync-state" --codex-path /usr/bin/true --codex-home "$RUNNER_TEMP/codex-fixture"
          codesign --verify --deep --strict "$HOME/Applications/Codex 用量看板.app"
          [[ $(file -b "$HOME/Applications/Codex 用量看板.app/Contents/MacOS/UsageLedger") == Mach-O* ]]
          cp -R apps/mac "$RUNNER_TEMP/dashboard-single-source"
          node -e 'require("fs").writeFileSync(process.env.RUNNER_TEMP + "/dashboard-single-source/edition.json", JSON.stringify({mode:"single",version:"0.5.0-rc.2"}))'
          node "$RUNNER_TEMP/dashboard-single-source/runtime/mac-install.mjs" --install-dir "$RUNNER_TEMP/dashboard-single" --data-dir "$RUNNER_TEMP/dashboard-single-state" --codex-path /usr/bin/true --codex-home "$RUNNER_TEMP/codex-fixture"
          codesign --verify --deep --strict "$HOME/Applications/Codex 用量看板单设备版.app"
          [[ $(file -b "$HOME/Applications/Codex 用量看板单设备版.app/Contents/MacOS/UsageLedger") == Mach-O* ]]
